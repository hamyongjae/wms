spring:
  application:
    name: wms

  # ===== 메일(SMTP) 발송 — 비밀번호 재설정 링크 =====
  # 값이 비어 있으면 콘솔 로그 발송(LoggingMailSender)으로 동작.
  # Gmail 사용 시: 2단계 인증 → 앱 비밀번호 발급 후 MAIL_USERNAME/MAIL_PASSWORD 환경변수로 주입.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    default-encoding: UTF-8

  # ===== PostgreSQL 연결 =====
  # [운영] 값은 환경변수로 주입(DB_URL/DB_USERNAME/DB_PASSWORD). 없으면 아래 개발 기본값 사용.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      # [저사양 서버] 커넥션 하나당 서버·DB 양쪽에 메모리가 들어간다. 기본값(10)은 1GB급 서버에는
      # 과하고, 지금 트래픽(테넌트 소수) 규모엔 5개면 충분하다 — postgres max_connections(15)도 낮춰둔 것과 짝을 맞춘다.
      maximum-pool-size: 5

  # ===== JPA / Hibernate =====
  jpa:
    # 컨트롤러/뷰 렌더링까지 영속성 컨텍스트를 열어두지 않는다(커넥션 조기 반납, 지연로딩 남용 방지)
    open-in-view: false
    hibernate:
      ddl-auto: update        # 엔티티 기준으로 테이블 자동 생성/수정
    show-sql: true            # 실행되는 SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true      # SQL 보기 좋게 정렬
        # ===== [테넌트 격리] =====
        # @TenantId 가 붙은 엔티티의 모든 조회에 tenant_id 조건을 자동으로 끼워 넣고,
        # 저장 시 현재 업체 id 를 자동으로 채운다. 상세는 backend/docs/tenant-isolation-design.md
        # (Spring 빈이 아니라 클래스명 프로퍼티로 등록한다 — Hibernate 가 직접 인스턴스화)
        tenant_identifier_resolver: com.example.wms.security.tenant.WmsTenantIdentifierResolver

# ===== 앱 커스텀 설정 =====
app:
  # [운영] 비밀번호 재설정 링크에 쓰는 프론트 주소. 운영에선 실제 도메인으로 주입.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  # [운영] 추가 CORS 허용 출처(콤마 구분). 예: https://wms.example.com
  #   프론트+API를 같은 도메인(Nginx)에서 서빙하면 same-origin이라 비워둬도 된다.
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}
  mail:
    # 발신자 표기 (미지정 시 username 사용)
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

# ===== JWT 설정 =====
jwt:
  # 보안 핵심: secret은 코드에 하드코딩하지 않는다.
  # 운영에서는 JWT_SECRET 환경변수로 주입하고, 없으면 아래 기본값(개발용) 사용.
  # Base64 인코딩된 최소 256bit(32byte 이상) 문자열이어야 한다.
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci13bXMtand0LWhtYWMtc2hhMjU2LTEyMzQ1Ng==}
  # Access 토큰 만료 시간 (밀리초)
  # 개발 편의를 위해 기본 12시간. 운영에서는 JWT_ACCESS_TOKEN_VALIDITY_MS 환경변수로
  # 짧게(예: 3600000=1시간) 주고 리프레시 토큰을 도입하는 것을 권장.
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:43200000}

# ===== 웹 푸시(VAPID) 설정 =====
push:
  vapid:
    # 운영에서는 VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY 환경변수로 실제 키를 주입한다.
    # 아래 기본값은 개발용으로 한 번 생성해둔 키 — 운영에 그대로 쓰지 않는다(유출 취급).
    subject: ${VAPID_SUBJECT:mailto:admin@smartwarehouse.duckdns.org}
    public-key: ${VAPID_PUBLIC_KEY:BLEcCNMFheU8889PpiYzfS96fEX3NLPHHy-pGz-OrBQb3knRq1z_rNfW7wi791y8y7xGdZigjwd1s6ZxKZEqvU8}
    private-key: ${VAPID_PRIVATE_KEY:YRsE64dXmqTGw9-3_hJnaV_tfK-Pk6e_CFdIOP-FHNg}

# ===== 데이터 정합화(마이그레이션) =====
wms:
  migration:
    # 기동 시 계약↔컨테이너 입출고 일정 재동기화(멱등). 한 번 정합화한 뒤엔 false로 꺼도 된다.
    sync-container-schedules: ${WMS_SYNC_CONTAINER_SCHEDULES:true}
