spring.application.name=wms

# PostgreSQL 연결 설정 (맨 뒤의 wms 자리에 본인이 만든 DB 이름을 적으세요)
spring.datasource.url=jdbc:postgresql://localhost:5432/wms
spring.datasource.username=postgres
spring.datasource.password=1234

# 자바 코드를 읽어서 PostgreSQL에 테이블을 자동으로 만들어주는 옵션
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT 설정 =====
# secret은 Base64 인코딩된 최소 256bit(32byte 이상) 문자열. 운영에서는 환경변수로 관리 권장.
jwt.secret=dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci13bXMtand0LWhtYWMtc2hhMjU2LTEyMzQ1Ng==
# Access 토큰 만료 시간 (밀리초, 기본 1시간)
jwt.access-token-validity-ms=3600000