plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// [Windows 전용 우회] 이 프로젝트 경로("...\프로젝트\...")에 한글이 있고, 이 컴퓨터의 활성
// 코드페이지가 949(MS949)로 고정돼 있다. Gradle이 테스트 실행용 JVM을 띄울 때 클래스패스가 길어지면
// @인자파일 방식을 쓰는데, 그 파일을 네이티브 런처가 MS949로 잘못 디코딩해 한글 경로가 깨져
// build/classes 자체를 못 찾는다(테스트 전부가 ClassNotFoundException으로 실패). JVM 플래그로는
// 못 고치므로(그 파일을 읽어야 플래그를 알 수 있는 순서상 모순) 빌드 산출물 위치를 한글 없는 경로로 옮긴다.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    layout.buildDirectory.set(file("${System.getProperty('user.home')}/.gradle-builds/wms-backend"))
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // 웹 (REST API) — 내장 톰캣 서버 + 컨트롤러 기능
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 보안 — 인증/인가, 비밀번호 암호화(BCrypt), 필터 체인
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT — 토큰 발급/검증 (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // JPA — DB 테이블을 자바 객체로 다루게 해주는 ORM
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 입력값 검증 — @NotNull, @Email, @Size 등
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 메일 발송 (SMTP) — 비밀번호 재설정 링크 실제 전송
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 웹 푸시 — VAPID 서명 + payload 암호화(aes128gcm)까지 처리해주는 표준 라이브러리.
    // 직접 구현하면 암호화 버그 위험이 커서, 검증된 라이브러리를 쓴다.
    implementation 'nl.martijndwars:web-push:5.1.1'
    // web-push가 EC 키 처리에 필요로 하는데 자체 POM에 딸려오지 않는다 — 직접 명시해야 함
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'

    // API 문서 자동 생성 (Swagger UI) — 버전은 최신으로 확인 권장
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // PostgreSQL 드라이버 (실행 시점에만 필요)
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok — 보일러플레이트(getter/생성자 등) 자동 생성
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DevTools — 코드 저장하면 서버 자동 재시작
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 테스트 (JUnit5, Mockito, AssertJ) — 보통 처음부터 포함돼 있음
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 보안 테스트 유틸 (@WithMockUser 등)
    testImplementation 'org.springframework.security:spring-security-test'

    // MockMvc 테스트 지원 — Boot 4에서 spring-boot-test-autoconfigure로부터 분리된 별도 모듈
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

    // 통합테스트용 실제 Postgres 컨테이너 — 네이티브 쿼리(date_trunc 등)는 H2로 대체 불가.
    // spring-boot-testcontainers(4.1.0)는 아직 postgresql/junit-jupiter 모듈이 배포 안 된
    // testcontainers 코어 2.0.5를 끌어와 실행 시 충돌하므로 쓰지 않고, 실제 배포된 최신 짝
    // (1.21.4)을 직접 지정한다 — @DynamicPropertySource로 접속정보를 넘기므로 스타터가 없어도 된다.
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
}

// Spring Boot BOM(io.spring.dependency-management)이 아직 postgresql/junit-jupiter
// 모듈이 없는 testcontainers 코어 2.0.5로 강제 승격시켜 1.21.4 계열과 뒤섞인다.
// 이 플러그인은 Gradle 기본 resolutionStrategy.force보다 우선하므로, 전용 DSL로 재정의한다.
dependencyManagement {
    dependencies {
        dependency 'org.testcontainers:testcontainers:1.21.4'
    }
}

tasks.named('test') {
	useJUnitPlatform()
}
